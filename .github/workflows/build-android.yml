name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/build-android.yml"

# The workflow's own commit only touches public/downloads/*.apk via
# [skip ci], so it never retriggers itself.

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'to website downloads')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab \
            -t "UMS Messages for Android" \
            -n "Android app for UMS Messages. Install the APK directly, or upload the AAB to Google Play."

      - name: Publish APK to the website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/release/app-release.apk public/downloads/UMS-Messages.apk
          ls -la public/downloads
          git add public/downloads
          git commit -m "Publish Android build to website downloads" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
