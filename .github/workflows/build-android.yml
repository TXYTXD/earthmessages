name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # The app shell loads the live site, so web code changes don't require
      # a rebuild — only native shell changes do.
      - "android/**"
      - "android-shell/**"
      - "capacitor.config.ts"
      - ".github/workflows/build-android.yml"

# The workflow's own commit only touches public/downloads/*.apk via
# [skip ci], so it never retriggers itself.

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'website downloads')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab \
            -t "UMS Messages for Android" \
            -n "Android app for UMS Messages. Install the APK directly, or upload the AAB to Google Play."

      # The APK is intentionally NOT published to the website — Android users
      # get the app from Google Play only (sideload prompts look scary).
      # The GitHub release above keeps the APK/AAB for Play Store uploads.
      - name: Remove any previously published website APK
        run: |
          if [ -f public/downloads/UMS-Messages.apk ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm public/downloads/UMS-Messages.apk
            git commit -m "Remove Android APK from website downloads"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
